# Production stack: Caddy (automatic HTTPS) -> frontend (static) + backend (API) -> Postgres.
# Single origin: https://$DOMAIN serves the app and /api, /auth. Nothing but 80/443 is published.
# Usage:  docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-testpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-testpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-testpilot}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${DOMAIN:?set DOMAIN in .env.production}/auth/google/callback
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      # Behind Caddy every request arrives from the proxy, so the rate limiter must read the
      # client IP from X-Forwarded-For (Caddy overwrites any client-supplied value).
      TRUSTED_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin: the SPA calls /api/* and /auth/* on whatever host served it.
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      API_ORIGIN: ""
    depends_on:
      - backend
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
