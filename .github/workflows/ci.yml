name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testpilot
          POSTGRES_PASSWORD: testpilot
          POSTGRES_DB: testpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://testpilot:testpilot@localhost:5432/testpilot_test
      SECRET_KEY: k3Jx8Qp2Wz7LmV4tRb9NcY6dHg1FsA5uEo0TiXe
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=app --cov-fail-under=80
      - name: Dependency audit (pip-audit)
        # Advisory: reports known-vulnerable packages without blocking merges.
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build
      - name: Dependency audit (npm audit)
        # Advisory: reports high/critical advisories without blocking merges.
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
