[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "T20", "SIM", "C4"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults
    "UP042",  # (str, Enum) kept for SQLAlchemy/Pydantic compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["alembic/", ".venv/"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
