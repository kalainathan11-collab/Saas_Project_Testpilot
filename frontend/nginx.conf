# Rendered by the nginx-unprivileged entrypoint (envsubst on /etc/nginx/templates/*.template).
# ${API_ORIGIN} is the API origin for the CSP connect-src; the Dockerfile defaults it to the
# build-time VITE_API_URL and it can be overridden at runtime via the API_ORIGIN env var.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers live in security-headers.inc (also an envsubst template). nginx does not
    # inherit add_header into a location that defines its own, so each location includes it.
    server_tokens off;

    # Hashed build assets: cache for a year
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: index.html must always be revalidated
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
